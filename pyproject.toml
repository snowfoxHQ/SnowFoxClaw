[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "snowfoxclaw"
version = "0.1.0"
description = "个人 Agent 智能体，住在你设备里的狐狸"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "snowfox", email = "142133502+snowfoxHQ@users.noreply.github.com" }]
keywords = ["agent", "ai", "assistant", "snowfoxclaw"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/snowfoxHQ/SnowFoxClaw"
Repository = "https://github.com/snowfoxHQ/SnowFoxClaw"
Issues = "https://github.com/snowfoxHQ/SnowFoxClaw/issues"

[project.optional-dependencies]
# 模型运行时较重，一律放 extras，保证 `pip install snowfoxclaw` 不拖入推理栈。
embed = ["onnxruntime>=1.17"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
foxclaw = "snowfoxclaw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snowfoxclaw"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
