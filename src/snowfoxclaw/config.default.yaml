# SnowFoxClaw 内置默认配置，随包分发，用户不应直接改这个文件。
# 合并顺序：本文件 -> 用户配置（默认 ~/.snowfoxclaw/config.yaml）-> SNOWFOXCLAW_* 环境变量。

embedding:
  # mock 用于测试与 CI；local 走 bge-small-zh-v1.5；ollama 走本地 /api/embeddings
  provider: mock
  model: bge-small-zh-v1.5
  # 维度一旦写库不允许运行时变更，改维度等于重建索引（architecture.md 8.3）
  dim: 512
  normalize: true
  batch_size: 16

retrieval:
  top_k: 5
  # high 敏感记忆默认不召回，显式要求时最多 1 条（schema/fields.md 第 3 节）
  high_sensitivity_quota: 1

storage:
  # 支持 ~ 展开；相对路径按库目录解析
  path: ~/.snowfoxclaw/snowfoxclaw.db
